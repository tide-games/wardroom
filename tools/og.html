<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#888}
#card{
  width:1200px;height:630px;position:relative;overflow:hidden;
  background:radial-gradient(120% 130% at 50% -10%, #3a302a, #241d19 75%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;
}
#felt{
  position:absolute;right:-230px;top:50%;transform:translateY(-50%);
  width:720px;height:520px;border-radius:50%/46%;
  background:radial-gradient(80% 90% at 50% 40%, #1f5748, #17453a 85%);
  box-shadow:inset 0 0 60px #00000066, 0 0 0 16px #6b4a30, 0 0 0 19px #4e3520, 0 10px 50px #000c;
}
.left{position:relative;z-index:2;padding-left:70px;max-width:560px}
h1{font-size:56px;font-weight:800;letter-spacing:.05em;color:#e9c15c;margin:0 0 14px;white-space:nowrap;text-shadow:0 2px 12px #000}
.tag{font-size:28px;color:#f2ede4;font-weight:700;margin:0 0 12px}
.sub{font-size:21px;color:#b8ac9a;line-height:1.55;margin:0 0 24px}
.chips{display:flex;gap:8px;align-items:center}
.pill{
  font-size:18px;color:#e9c15c;background:#00000055;border:1.5px solid #e9c15c66;
  border-radius:10px;padding:9px 16px;font-weight:700;
}
.hand{position:absolute;right:120px;top:50%;transform:translateY(-50%);z-index:2}
.pcard{
  width:150px;height:212px;border-radius:12px;background:#fbfaf6;color:#222;
  position:absolute;box-shadow:0 8px 30px #000a;padding:14px 16px;font-weight:800;
}
.pcard .r{font-size:64px;line-height:1;display:block}
.pcard .s{font-size:58px;line-height:1;position:absolute;bottom:12px;right:14px}
.pcard.red{color:#c33}
.stack{position:absolute;right:340px;bottom:110px;z-index:2}
.chip{
  width:64px;height:14px;border-radius:50%;position:absolute;left:0;
  border:2px dashed #ffffff88;
}
</style></head><body>
<div id="card">
  <div id="felt"></div>
  <div class="left">
    <h1>🃏 THE WARDROOM</h1>
    <p class="tag">Tournament poker in the officers' mess.</p>
    <p class="sub">A six-handed no-limit sit &amp; go against five characters who
    play their nature — on a real engine: exact side pots, the full min-raise
    law, every shuffle seeded and replayable.</p>
    <div class="chips"><span class="pill">♠ blinds rise every 8 hands</span>
    <span class="pill">last one holding chips wins</span></div>
  </div>
  <div class="hand">
    <div class="pcard" style="transform:rotate(-9deg);right:120px;top:-105px"><span class="r">A</span><span class="s">♠</span></div>
    <div class="pcard red" style="transform:rotate(7deg);right:0;top:-95px"><span class="r">A</span><span class="s">♥</span></div>
  </div>
  <div class="stack">
    <span class="chip" style="background:#a54040;bottom:0"></span>
    <span class="chip" style="background:#a54040;bottom:10px"></span>
    <span class="chip" style="background:#3d6ea5;bottom:20px"></span>
    <span class="chip" style="background:#3d6ea5;bottom:30px"></span>
    <span class="chip" style="background:#3f7d4e;bottom:40px"></span>
    <span class="chip" style="background:#e9c15c;bottom:50px"></span>
  </div>
</div>
</body></html>
